
name: Flask Tests, Email Report and Conditional Deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests and generate CI report
        id: tests
        shell: powershell
        continue-on-error: true
        run: |
          python -m pytest -v --json-report --json-report-file=test-results.json
          $testExit = $LASTEXITCODE

          Add-Content -Path $env:GITHUB_OUTPUT -Value "exit_code=$testExit"
          $env:TEST_EXIT = "$testExit"

          @'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          results_file = Path("test-results.json")
          details = []
          total = passed = failed = 0

          if results_file.exists():
              try:
                  data = json.loads(results_file.read_text(encoding="utf-8"))
                  summary = data.get("summary", {})
                  total = summary.get("total", 0)
                  passed = summary.get("passed", 0)
                  failed = summary.get("failed", 0)

                  for item in data.get("tests", []):
                      call = item.get("call", {})
                      crash = call.get("crash", {})
                      details.append({
                          "name": item.get("nodeid", "Unknown test"),
                          "result": item.get("outcome", "unknown"),
                          "failure_message": (
                              crash.get("message")
                              or call.get("longrepr")
                              or ""
                          )
                      })
              except Exception as error:
                  details.append({
                      "name": "Report parsing",
                      "result": "failed",
                      "failure_message": str(error)
                  })
          else:
              details.append({
                  "name": "Pytest execution",
                  "result": "failed",
                  "failure_message": "Pytest did not generate a JSON results file."
              })

          report = {
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "pipeline_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "execution_timestamp": datetime.now(timezone.utc).isoformat(),
              "tests": details,
              "total": total,
              "passed": passed,
              "failed": failed,
              "overall_status": (
                  "passed" if os.environ.get("TEST_EXIT") == "0" else "failed"
              )
          }

          Path("test-report.json").write_text(
              json.dumps(report, indent=4),
              encoding="utf-8"
          )

          print(json.dumps(report, indent=4))
          '@ | python -

      - name: Send report to local receiver
        if: always()
        shell: powershell
        run: |
          if (Test-Path "test-report.json") {
              Invoke-RestMethod `
                -Uri "http://127.0.0.1:5001/report" `
                -Method Post `
                -ContentType "application/json" `
                -InFile "test-report.json"

              Write-Host "Local CI report sent successfully."
          } else {
              Write-Error "CI report file was not generated."
          }

      - name: Email test report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "Test Report - ${{ steps.tests.outputs.exit_code == '0' && 'PASSED' || 'FAILED' }} - ${{ github.sha }}"
          to: ${{ secrets.EMAIL_ADDRESS }}
          from: ${{ secrets.EMAIL_ADDRESS }}
          body: |
            Assignment Submission Portal Test Report

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Pipeline Run: ${{ github.run_id }}
            Test Exit Code: ${{ steps.tests.outputs.exit_code }}

            Detailed JSON report is attached.
          attachments: test-report.json

      - name: Fail workflow if tests failed
        if: steps.tests.outputs.exit_code != '0'
        shell: powershell
        run: exit 1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
